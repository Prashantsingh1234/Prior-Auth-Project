# ============================================================
# Alembic Configuration
# PA Review Platform — Database Migration Tool
# ============================================================

[alembic]
# Path to migration scripts
script_location = app/db/migrations

# Template used to generate migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for generated migration file timestamps
timezone = UTC

# Max length for migration slug
truncate_slug_length = 40

# Version locations (supports multiple directories)
version_locations = %(here)s/app/db/migrations/versions

# Sys path — ensures app package is importable
prepend_sys_path = .

# Database URL is loaded dynamically from settings in env.py
# Do NOT set sqlalchemy.url here — it is injected by app/db/migrations/env.py

[post_write_hooks]
# Format generated migrations with black
hooks = black
black.type = console_scripts
black.entrypoint = black
black.options = -l 100 REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
