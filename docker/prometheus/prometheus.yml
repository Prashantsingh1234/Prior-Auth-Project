# ============================================================
# PA Review Platform — Prometheus Configuration
# ============================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: "pa-platform"
    environment: "development"

# Load alert + recording rules
rule_files:
  - "/etc/prometheus/alerts.yml"
  - "/etc/prometheus/recording_rules.yml"

# Alertmanager integration (enable when alertmanager container is running)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ["alertmanager:9093"]

scrape_configs:
  # FastAPI application metrics
  - job_name: "pa-api"
    static_configs:
      - targets: ["pa-api:8000"]
    metrics_path: "/metrics"
    scrape_interval: 10s

  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Redis metrics (enable when redis_exporter sidecar is added)
  # - job_name: "redis"
  #   static_configs:
  #     - targets: ["redis-exporter:9121"]

  # Node / host metrics (enable with node_exporter)
  # - job_name: "node"
  #   static_configs:
  #     - targets: ["node-exporter:9100"]
