# PRODUCTION USAGE:
#   Never commit real values. Use one of:
#     - Sealed Secrets (bitnami/sealed-secrets): kubeseal --format yaml < secret.yaml > sealed-secret.yaml
#     - External Secrets Operator pulling from AWS Secrets Manager / HashiCorp Vault
#     - kubectl create secret generic pa-platform-secrets --from-env-file=.env.production
#
# All values below are base64-encoded placeholders.
# Encode real values with: echo -n 'myvalue' | base64
