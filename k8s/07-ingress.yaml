# k8s/07-ingress.yaml — Nginx Ingress + TLS via cert-manager
# Prerequisites:
#   kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/cloud/deploy.yaml
#   kubectl apply -f https://github.com/cert-manager/cert-manager/releases/latest/download/cert-manager.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pa-platform-ingress
  namespace: pa-platform
  labels:
    app.kubernetes.io/name: pa-review-platform
    app.kubernetes.io/component: ingress
  annotations:
    # Ingress controller
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/use-regex: "true"

    # TLS — cert-manager issues Let's Encrypt certificate
    cert-manager.io/cluster-issuer: "letsencrypt-prod"

    # Rate limiting (supplements app-level limiting)
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "3"
    nginx.ingress.kubernetes.io/limit-connections: "20"

    # Proxy settings
    nginx.ingress.kubernetes.io/proxy-body-size: "55m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"

    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "Strict-Transport-Security: max-age=63072000; includeSubDomains; preload";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "Cache-Control: no-store, no-cache, must-revalidate";

    # Enable CORS for the API (handled by FastAPI middleware, just ensure passthrough)
    nginx.ingress.kubernetes.io/enable-cors: "false"

    # Force HTTPS
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

    # Metrics endpoint: restrict to internal CIDR (Prometheus scraper)
    nginx.ingress.kubernetes.io/server-snippet: |
      location = /metrics {
        allow 10.0.0.0/8;
        deny all;
      }
spec:
  tls:
    - hosts:
        - pa-platform.example.com     # REPLACE with your domain
        - api.pa-platform.example.com
      secretName: pa-platform-tls
  rules:
    - host: pa-platform.example.com
      http:
        paths:
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: pa-api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pa-frontend    # assumes a separate frontend service
                port:
                  number: 80
    - host: api.pa-platform.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pa-api
                port:
                  name: http
---
# cert-manager ClusterIssuer (Let's Encrypt production)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: devops@pa-platform.example.com    # REPLACE with your email
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
      - http01:
          ingress:
            class: nginx