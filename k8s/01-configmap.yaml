# k8s/01-configmap.yaml — Non-secret runtime configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: pa-platform-config
  namespace: pa-platform
  labels:
    app.kubernetes.io/name: pa-review-platform
    app.kubernetes.io/component: config
data:
  ENVIRONMENT: "production"
  DEBUG: "false"
  LOG_FORMAT: "json"
  LOG_LEVEL: "INFO"

  API_PREFIX: "/api/v1"
  API_TITLE: "AI-Assisted Prior Authorization Review Platform"

  # Database connection pool
  DB_PORT: "3306"
  DB_POOL_SIZE: "10"
  DB_MAX_OVERFLOW: "20"
  DB_POOL_TIMEOUT: "30"
  DB_POOL_RECYCLE: "1800"
  DB_ECHO: "false"

  # Redis
  REDIS_TTL: "3600"
  REDIS_MAX_CONNECTIONS: "20"

  # JWT
  JWT_ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  REFRESH_TOKEN_EXPIRE_DAYS: "7"

  # Rate limiting
  RATE_LIMIT_REQUESTS: "100"
  RATE_LIMIT_WINDOW: "60"

  # Prometheus
  PROMETHEUS_ENABLED: "true"
  PROMETHEUS_ENDPOINT: "/metrics"

  # File upload
  MAX_UPLOAD_SIZE_BYTES: "52428800"
  ALLOWED_UPLOAD_EXTENSIONS: '[".pdf",".png",".jpg",".jpeg",".tiff",".json",".txt"]'

  # Pinecone
  PINECONE_ENVIRONMENT: "us-east-1-aws"
  PINECONE_INDEX_NAME: "pa-policies"
  PINECONE_NAMESPACE: "production"

  # OpenAI
  OPENAI_MODEL: "gpt-4o"
  OPENAI_MAX_TOKENS: "4096"
  OPENAI_TEMPERATURE: "0.0"
  OPENAI_REQUEST_TIMEOUT: "60"
  OPENAI_EMBEDDING_MODEL: "text-embedding-3-small"

  # Gunicorn
  GUNICORN_WORKERS: "4"
  GUNICORN_TIMEOUT: "120"
  GUNICORN_GRACEFUL_TIMEOUT: "30"
  GUNICORN_KEEPALIVE: "5"
  GUNICORN_MAX_REQUESTS: "1000"
  GUNICORN_MAX_REQUESTS_JITTER: "100"

  # RabbitMQ queues
  RABBITMQ_PA_QUEUE: "pa.requests"
  RABBITMQ_NOTIFICATION_QUEUE: "pa.notifications"
  RABBITMQ_PREFETCH_COUNT: "10"

  # OCR / Ingestion
  INGESTION_OCR_ENABLED: "true"
  INGESTION_CHUNK_TOKENS: "512"
  INGESTION_OVERLAP_TOKENS: "50"
  AZURE_OCR_CONFIDENCE_THRESHOLD: "0.80"
  AZURE_OCR_TIMEOUT: "30"