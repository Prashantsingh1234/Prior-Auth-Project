[tool.poetry]
name = "pa-review-platform"
version = "0.1.0"
description = "AI-Assisted Prior Authorization Review Platform — Clinical Decision Support"
authors = ["Healthcare AI Team <ai@healthcare.internal>"]
license = "Proprietary"
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"

# Web framework
fastapi = "^0.111.0"
uvicorn = { extras = ["standard"], version = "^0.29.0" }
gunicorn = "^22.0.0"

# Data validation
pydantic = "^2.7.0"
pydantic-settings = "^2.2.1"
email-validator = "^2.1.2"

# Auth & Security
python-jose = { extras = ["cryptography"], version = "^3.3.0" }
passlib = { extras = ["bcrypt"], version = "^1.7.4" }
PyJWT = "^2.8.0"
cryptography = "^42.0.7"
python-multipart = "^0.0.9"

# HTTP client
httpx = "^0.27.0"

# Database
sqlalchemy = { extras = ["asyncio"], version = "^2.0.30" }
aiomysql = "^0.2.0"
alembic = "^1.13.1"

# Cache
redis = { extras = ["asyncio"], version = "^5.0.4" }

# Message Queue
aio-pika = "^9.4.1"

# Vector DB
pinecone-client = "^4.1.0"

# LLM / AI
langchain = "^0.2.0"
langchain-openai = "^0.1.8"
langgraph = "^0.1.0"
langsmith = "^0.1.63"
openai = "^1.30.0"

# OCR / Document Intelligence
azure-ai-documentintelligence = "^1.0.0b4"
paddleocr = "^2.7.3"

# Evaluation
deepeval = "^0.21.0"
ragas = "^0.1.9"

# Observability
prometheus-fastapi-instrumentator = "^7.0.0"
prometheus-client = "^0.20.0"

# Logging
structlog = "^24.1.0"
rich = "^13.7.1"

# Utilities
tenacity = "^8.3.0"
python-dotenv = "^1.0.1"
orjson = "^3.10.3"
slowapi = "^0.1.9"
python-dateutil = "^2.9.0"
pytz = "^2024.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.6"
pytest-cov = "^5.0.0"
pytest-mock = "^3.14.0"
httpx = "^0.27.0"
factory-boy = "^3.3.0"
faker = "^25.2.0"
ruff = "^0.4.4"
mypy = "^1.10.0"
black = "^24.4.2"
pre-commit = "^3.7.1"
locust = "^2.28.0"
types-passlib = "^1.7.7.20240327"
types-python-jose = "^3.3.4.20240106"
types-pytz = "^2024.1.0.20240417"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=app --cov-report=term-missing --cov-report=html -v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008", "N818"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
